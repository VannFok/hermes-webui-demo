    <main class="experience" aria-label="Hermes team message space">
      <header class="hud hud-top" aria-label="Hermes status">
        <div class="brand-lockup">
          <img class="brand-sigil" src="./hermes-avatar-logo-96.png" width="96" height="96" alt="" aria-hidden="true" decoding="async" />
          <div>
            <h1>Hermes Team</h1>
            <p>coordination surface · live agent field</p>
          </div>
        </div>

        <section class="agent-strip" aria-label="Agent activity">
          <div class="agent-dot is-active" data-agent="agent-01">
            <span></span>
            <strong>HermesFox</strong>
          </div>
          <div class="agent-dot" data-agent="agent-02">
            <span></span>
            <strong>Hermies</strong>
          </div>
          <div class="agent-dot" data-agent="agent-03">
            <span></span>
            <strong>BF</strong>
          </div>
          <div class="agent-dot" data-agent="agent-04">
            <span></span>
            <strong>deercare</strong>
          </div>
        </section>

      </header>

      <section id="bubblesLayer" class="bubbles-layer" aria-live="polite" aria-label="Agent message bubbles"></section>
      <section id="chipDock" class="chip-dock" aria-label="Recent agent messages"></section>
      <section id="cronInbox" class="cron-inbox" aria-label="Cron inbox">
        <button id="cronInboxToggle" class="cron-inbox__toggle" type="button" aria-expanded="false">
          <span aria-hidden="true"></span>
          <strong>CRON</strong>
          <em id="cronInboxCount">0</em>
        </button>
        <div id="cronInboxPanel" class="cron-inbox__panel" aria-hidden="true">
          <header>
            <span>cron inbox</span>
            <button id="cronInboxClose" type="button" aria-label="关闭 cron inbox">×</button>
          </header>
          <div id="cronInboxList" class="cron-inbox__list"></div>
        </div>
      </section>
      <aside id="historyPanel" class="history-panel" aria-label="Agent history" aria-hidden="true">
        <div class="history-panel__shell">
          <header class="history-panel__head">
            <div>
              <span id="historyPanelAgent">History</span>
              <strong>更多历史</strong>
            </div>
            <button id="historyPanelClose" type="button" aria-label="关闭历史">×</button>
          </header>
          <div class="history-panel__filters">
            <input id="historySearch" type="search" placeholder="搜索历史" />
            <select id="historySource" aria-label="按来源筛选">
              <option value="">全部来源</option>
              <option value="wsl">WSL</option>
              <option value="telegram">Telegram</option>
              <option value="web">Web</option>
            </select>
            <input id="historyDate" type="date" aria-label="按日期筛选" />
          </div>
          <div id="historyPanelList" class="history-panel__list"></div>
        </div>
      </aside>
      <section id="cronLayer" class="cron-layer" aria-label="Cron task messages" aria-hidden="true"></section>

      <section id="replyComposer" class="reply-composer" aria-label="Agent input composer" aria-hidden="true">
        <div class="reply-shell">
          <div class="reply-meta">
            <span id="replyTarget">Reply</span>
            <span id="queueState">0 pending</span>
          </div>
          <div id="replyQuote" class="reply-quote" hidden>
            <span id="replyQuoteLabel"></span>
            <p id="replyQuoteText"></p>
          </div>
          <div class="reply-row">
            <textarea id="replyInput" rows="2" placeholder="输入内容，Enter 发送，Shift + Enter 换行"></textarea>
            <button id="sendReplyButton" class="send-action" type="button" disabled>发送</button>
          </div>
        </div>
      </section>
    </main>

    <template id="bubbleTemplate">
      <article class="message-bubble" tabindex="0">
        <span class="bubble-orbital" aria-hidden="true"></span>
        <button class="bubble-copy" type="button" title="复制文本" aria-label="复制文本"><span aria-hidden="true"></span></button>
        <div class="bubble-head">
          <span class="agent-beacon" aria-hidden="true"></span>
          <div>
            <strong class="bubble-agent"></strong>
            <time class="bubble-time"></time>
          </div>
        </div>
        <p class="bubble-text"></p>
        <div class="bubble-foot" aria-hidden="true">
          <span></span>
          <span></span>
        </div>
      </article>
    </template>

    <template id="chipTemplate">
      <button class="message-chip" type="button">
        <span class="chip-light" aria-hidden="true"></span>
        <span class="chip-agent"></span>
        <span class="chip-count"></span>
      </button>
    </template>
